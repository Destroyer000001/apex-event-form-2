<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Submission</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;

            background:
                linear-gradient(
                    rgba(5, 15, 35, 0.82),
                    rgba(5, 15, 35, 0.88)
                ),
                url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4);

            border: 1px solid rgba(255,255,255,0.5);
        }

        .logo {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #2563eb;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #111827;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #344054;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d0d5dd;
            border-radius: 9px;

            font-size: 15px;
            outline: none;

            background: #fff;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        input[type="file"] {
            padding: 11px;
            cursor: pointer;
        }

        .note {
            font-size: 12px;
            color: #667085;
            margin-top: 8px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #111827;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #98a2b3;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .container {
                padding: 27px 20px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">APEX</div>

    <h1>Paper Submission</h1>

    <div class="subtitle">
        Submit your paper securely using the form below
    </div>

    <form id="submissionForm">

        <label for="schoolName">School Name</label>

        <input
            type="text"
            id="schoolName"
            placeholder="Enter your school name"
            required
        >


        <label for="schoolCode">School Code</label>

        <input
            type="text"
            id="schoolCode"
            placeholder="Enter your school code"
            required
        >


        <label for="file">Submission File</label>

        <input
            type="file"
            id="file"
            accept=".pdf,.jpg,.jpeg,.png"
            required
        >

        <div class="note">
            📎 Accepted formats: PDF, JPG, JPEG, PNG<br>
            Maximum file size: 10 MB
        </div>


        <button type="submit" id="submitButton">
            Submit Paper →
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        Please make sure your submission file is correct before submitting.
    </div>

</div>


<script>

const form = document.getElementById("submissionForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const schoolName =
        document.getElementById("schoolName").value.trim();

    const schoolCode =
        document.getElementById("schoolCode").value.trim();

    const fileInput =
        document.getElementById("file");

    const file = fileInput.files[0];

    if (!file) {
        message.textContent = "Please select a file.";
        return;
    }

    const maxSize = 10 * 1024 * 1024;

    if (file.size > maxSize) {
        message.textContent =
            "File is too large. Maximum size is 10 MB.";
        return;
    }

    const allowedTypes = [
        "application/pdf",
        "image/jpeg",
        "image/png"
    ];

    if (!allowedTypes.includes(file.type)) {
        message.textContent =
            "Only PDF, JPG, JPEG and PNG files are allowed.";
        return;
    }

    message.textContent = "Submitting...";
    submitButton.disabled = true;

    try {

        const reader = new FileReader();

        reader.onload = async function() {

            const base64Data =
                reader.result.split(",")[1];

            const data = {
                schoolName: schoolName,
                schoolCode: schoolCode,
                fileName: file.name,
                fileData: base64Data,
                mimeType: file.type
            };

            const response = await fetch(
                "https://script.google.com/macros/s/AKfycbwC3JSSpRjqXmabkOBJbxtU9W1SXEuY5caLV874wPKTROEV2fC-Z8W2H4l3R7C45AN_/exec",
                {
                    method: "POST",
                    body: JSON.stringify(data)
                }
            );

            const result = await response.json();

            if (!result.success) {
                throw new Error(result.message);
            }

            message.textContent =
                "Submission successful!";

            form.reset();

            submitButton.disabled = false;
        };

        reader.readAsDataURL(file);

    } catch (error) {

        console.error(error);

        message.textContent =
            "Submission failed. Please try again.";

        submitButton.disabled = false;
    }

});

</script>

</body>
</html>
